name: build-unsigned-ipa

on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "构建配置"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - Debug
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    paths:
      - "IPATemplate/**"
      - "project.yml"
      - ".github/workflows/build-ipa.yml"

# GITHUB_TOKEN 权限：本仓库默认令牌是只读的（实测 Contents: read），
# dist 分支推送需要 contents:write，gh issue create 上报需要 issues:write。
permissions:
  contents: write
  issues: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build unsigned IPA
    # macos-15：默认 Xcode 16.4；且 macos-14 镜像 2026-11-02 起停止支持
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          set -euo pipefail
          # xcodegen 2.46 生成的 .xcodeproj 是 Xcode 16 格式（objectVersion=77），
          # 必须用 Xcode 16+ 打开；镜像默认一般是 16.x，这里显式优先选 16 系保底。
          XCODE_APP=$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          fi
          echo "selected: $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcode-select -p
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # 仓库里图标以 base64 文本（icon_1024.b64）存放，构建前解码成 PNG。
      # 这样纯文本通道（API 推送）也能可靠传输二进制图标。
      - name: Prepare AppIcon (decode base64)
        run: |
          set -euo pipefail
          ICON_DIR="IPATemplate/Assets.xcassets/AppIcon.appiconset"
          if [ -f "$ICON_DIR/icon_1024.b64" ]; then
            python3 -c "import base64;open('$ICON_DIR/icon_1024.png','wb').write(base64.b64decode(open('$ICON_DIR/icon_1024.b64','rb').read()))"
            echo "OK: icon_1024.png decoded from icon_1024.b64"
          elif [ -f "$ICON_DIR/icon_1024.png" ]; then
            echo "OK: icon_1024.png already present"
          else
            echo "no icon found, generating placeholder via make_icon.py"
            python3 make_icon.py
          fi
          ls -l "$ICON_DIR"

      - name: Resolve packages (if any)
        run: |
          set -euo pipefail
          xcodebuild \
            -project IPATemplate.xcodeproj \
            -scheme IPATemplate \
            -configuration "${{ inputs.configuration || 'Release' }}" \
            -clonedSourcePackagesDirPath SourcePackages \
            -resolvePackageDependencies || echo "no package dependencies"

      - name: Build for iphoneos (no signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project IPATemplate.xcodeproj \
            -scheme IPATemplate \
            -configuration "${{ inputs.configuration || 'Release' }}" \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            -archivePath build/IPATemplate.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ENABLE_BITCODE=NO \
            clean build 2>&1 | tee build.log

      # 云更新靠 CFBundleVersion（build 号）判断新旧，服务端会拒绝 build 号
      # 没变大的发布。project.yml 里把它写死成了 "1"，不处理的话每次 CI 打出来
      # 都是 1，第一次发布之后就再也发不出新版了。
      #
      # 曾经用 ${{ github.run_number }} 覆盖，但它并不可靠：工作流文件被删后
      # 重建、或仓库重建时，这个计数会直接归 1。实测就发生过一次 —— 线上已装
      # 的是 build 7，CI 却打出 build 1，客户端比较后判定是降级，从此再也收
      # 不到更新，而且外表毫无异常。
      #
      # 改成用 dist 分支上的 build.txt 当持久计数器：每跑一次就取回上次的值 +1，
      # 推回去时一并写回。dist 分支是本项目自己的产物分支，不会被重建。
      # 注意：本 job 全程 CODE_SIGNING_ALLOWED=NO，改动 Info.plist 不会破坏签名；
      # 真正的签名在服务端用 zsign 做。
      - name: Stamp build number
        run: |
          set -euo pipefail
          APP_DIR="build/Build/Products/${{ inputs.configuration || 'Release' }}-iphoneos/IPATemplate.app"
          test -d "$APP_DIR" || { echo "ERROR: $APP_DIR not found"; exit 1; }

          # 取回 dist 分支上的计数器（--depth=1 就够，我们只读一个文件）
          git fetch --depth=1 origin +refs/heads/dist:refs/remotes/origin/dist \
            || echo "dist 分支还不存在，本轮从 0 起算"
          LAST=$(git show refs/remotes/origin/dist:build.txt 2>/dev/null | tr -d '[:space:]' || echo 0)
          # 不是纯数字（文件不存在 / 被写坏）就当 0
          case "$LAST" in ''|*[!0-9]*) LAST=0 ;; esac
          BUILD_NUM=$(( LAST + 1 ))
          echo "dist 上的旧 build 号 = ${LAST}，本轮 build 号 = ${BUILD_NUM}"

          # 打了 v1.2.3 这种 tag 时，顺手把展示版本号也对上
          SHORT_VER="1.0.0"
          if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
            SHORT_VER="${GITHUB_REF#refs/tags/v}"
          fi

          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${BUILD_NUM}" "$APP_DIR/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${SHORT_VER}" "$APP_DIR/Info.plist"

          echo "CFBundleVersion          = $(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_DIR/Info.plist")"
          echo "CFBundleShortVersionString = $(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_DIR/Info.plist")"
          echo "BUILD_NUM=${BUILD_NUM}" >> "$GITHUB_ENV"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_DIR="build/Build/Products/${{ inputs.configuration || 'Release' }}-iphoneos/IPATemplate.app"
          test -d "$APP_DIR" || { echo "ERROR: $APP_DIR not found"; find build/Build/Products -maxdepth 2 -type d; exit 1; }

          # 清掉任何签名残留，确保产出的是"未签名"IPA
          rm -rf "$APP_DIR/_CodeSignature"
          rm -f  "$APP_DIR/embedded.mobileprovision"
          rm -f  "$APP_DIR/SC_Info"/*.sinf 2>/dev/null || true

          mkdir -p Payload
          rm -rf "Payload/IPATemplate.app"
          cp -R "$APP_DIR" Payload/

          # 去掉 macOS 侧垃圾文件
          find Payload -name ".DS_Store" -delete 2>/dev/null || true
          find Payload -name "__MACOSX" -type d -exec rm -rf {} + 2>/dev/null || true

          # 保证可执行位（installation_proxy 要求）
          BIN="Payload/IPATemplate.app/IPATemplate"
          if [ -f "$BIN" ]; then chmod 755 "$BIN"; fi

          rm -f IPATemplate-unsigned.ipa
          zip -qry IPATemplate-unsigned.ipa Payload
          ls -lh IPATemplate-unsigned.ipa

      - name: Verify IPA structure
        run: |
          set -euo pipefail
          unzip -l IPATemplate-unsigned.ipa | head -40
          echo "--- required entries ---"
          unzip -l IPATemplate-unsigned.ipa | grep -E "Payload/IPATemplate.app/Info.plist" || { echo "MISSING Info.plist"; exit 1; }
          unzip -l IPATemplate-unsigned.ipa | grep -E "Payload/IPATemplate.app/IPATemplate$" || { echo "MISSING executable"; exit 1; }
          unzip -l IPATemplate-unsigned.ipa | grep -E "_CodeSignature" && { echo "UNEXPECTED _CodeSignature"; exit 1; } || echo "OK: no _CodeSignature (unsigned)"
          echo "--- Mach-O check ---"
          rm -rf verify && mkdir verify && cd verify
          unzip -q ../IPATemplate-unsigned.ipa
          file Payload/IPATemplate.app/IPATemplate || true
          xxd -l 4 Payload/IPATemplate.app/IPATemplate || true

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPATemplate-unsigned-ipa
          path: IPATemplate-unsigned.ipa
          if-no-files-found: error
          retention-days: 14

      # 兜底通道：把 IPA 推到 dist 孤立分支。
      # 用途：artifact 的下载跳转（Azure blob）在某些网络下不可达，
      # 而 api.github.com 的内容接口通常可达，可直接从 dist 分支取回 IPA。
      #
      # 血泪教训：这一步曾经静默失败过很多次。
      # IPATemplate-unsigned.ipa 被误传进了源码仓库，CI 重新构建后它相对
      # main 分支就是「已修改文件」，git switch --orphan 直接拒绝：
      #   error: Your local changes ... would be overwritten by checkout
      # 而因为挂了 continue-on-error，整个 job 照样显示 success，
      # 结果每次取回的都是几个月前的旧包，外表完全看不出来。
      # 修法：先把产物挪出工作区，把工作区恢复干净后再切分支，绕开冲突。
      - name: Push IPA to dist branch (fallback channel)
        continue-on-error: true
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 先把产物挪走，让工作区干净（否则 git switch --orphan 会被脏文件卡住）
          mv IPATemplate-unsigned.ipa /tmp/ipa-to-publish.ipa
          git checkout -- . 2>/dev/null || true
          git branch -D dist 2>/dev/null || true
          git switch --orphan dist

          # dist 分支只放产物，其余全清（保留 .git）
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          mv /tmp/ipa-to-publish.ipa IPATemplate-unsigned.ipa

          # 写回计数器：下一轮 CI 会读它并 +1。
          # 必须和 IPA 同一次提交，否则下一轮读到的可能是旧值，build 号就会原地踏步
          # 甚至回退，云更新会静默失效。
          echo "${BUILD_NUM}" > build.txt
          echo "本轮写入 build.txt = $(cat build.txt)"

          # 用 add -A 把"删除"也一并入账：无论 --orphan 是否清空索引，
          # 最终提交的树都等于工作区（只有 IPA + build.txt），不会夹带旧文件
          git add -A
          git commit -m "unsigned IPA build ${BUILD_NUM} (run ${GITHUB_RUN_ID})"
          git push --force origin dist

          # 推完必须自证：比对远端内容与本地产物，不一致就 fail。
          # 没有这一步，推送失败会被 continue-on-error 吞掉，
          # 构建绿着但 dist 上还是旧包 —— 就是上面那个坑的根源。
          REMOTE_SHA=$(git rev-parse HEAD:IPATemplate-unsigned.ipa)
          echo "dist HEAD blob = ${REMOTE_SHA}"
          git cat-file -p "${REMOTE_SHA}" > /tmp/dist-roundtrip.ipa
          LOCAL_SHA=$(shasum -a 256 IPATemplate-unsigned.ipa | cut -d' ' -f1)
          RT_SHA=$(shasum -a 256 /tmp/dist-roundtrip.ipa | cut -d' ' -f1)
          echo "local=${LOCAL_SHA}"
          echo "dist =${RT_SHA}"
          if [ "${LOCAL_SHA}" != "${RT_SHA}" ]; then
            echo "::error::dist 分支内容与本次产物不一致，落地通道不可信"
            exit 1
          fi

          # 计数器自证：远端读回来的必须等于本轮写入的值，否则下一轮会从旧值起算
          RT_BUILD=$(git show HEAD:build.txt | tr -d '[:space:]')
          echo "dist build.txt = ${RT_BUILD}（应为 ${BUILD_NUM}）"
          if [ "${RT_BUILD}" != "${BUILD_NUM}" ]; then
            echo "::error::dist 分支 build.txt=${RT_BUILD}，与本次 ${BUILD_NUM} 不一致"
            exit 1
          fi

          # 再把包内的 CFBundleVersion 和计数器对齐校验。
          # PlistBuddy 写失败时不会让这一步 fail，光看 job 是绿的，
          # 只有把两个数摆在一起比，才能发现「计数器涨了包没涨」。
          IPA_BUILD=$(unzip -p IPATemplate-unsigned.ipa \
            Payload/IPATemplate.app/Info.plist \
            | plutil -extract CFBundleVersion raw -o - - 2>/dev/null || echo "?")
          echo "IPA 内 CFBundleVersion = ${IPA_BUILD}（应为 ${BUILD_NUM}）"
          if [ "${IPA_BUILD}" != "${BUILD_NUM}" ]; then
            echo "::error::IPA 内 CFBundleVersion=${IPA_BUILD}，与计数器 ${BUILD_NUM} 不一致"
            exit 1
          fi

          echo "OK: dist 分支已更新，产物 / 计数器 / 包内版本号三者一致"

      # 构建状态上报：自动建一个 issue，方便自动化轮询得知成败，
      # 成功时附带 IPA 大小与 SHA256（用于下载后校验完整性）。
      - name: Report build status via issue
        if: always()
        # 上报只是通知手段，失败不能把一次成功的构建判成失败
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          RAW_URL="https://raw.githubusercontent.com/${{ github.repository }}/dist/IPATemplate-unsigned.ipa"
          if [ "${{ job.status }}" = "success" ]; then
            IPA_SIZE=$(stat -f%z IPATemplate-unsigned.ipa 2>/dev/null || echo 0)
            IPA_SHA=$(shasum -a 256 IPATemplate-unsigned.ipa 2>/dev/null | cut -d' ' -f1)
            IPA_BUILD=$(unzip -p IPATemplate-unsigned.ipa Payload/IPATemplate.app/Info.plist \
              | plutil -extract CFBundleVersion raw -o - - 2>/dev/null || echo "?")
            IPA_VER=$(unzip -p IPATemplate-unsigned.ipa Payload/IPATemplate.app/Info.plist \
              | plutil -extract CFBundleShortVersionString raw -o - - 2>/dev/null || echo "?")
            gh issue create --title "✅ 构建成功 · 未签名 IPA 已就绪" --body "运行记录：${RUN_URL}

          IPA 大小：${IPA_SIZE} 字节
          IPA SHA256：${IPA_SHA}
          版本：${IPA_VER}（build ${IPA_BUILD}）

          发布到线上（让客户端收到更新提示）：
          \`\`\`
          python publish_update.py IPATemplate-unsigned.ipa --notes \"更新说明\"
          \`\`\`
          build 号必须比线上已发布的大，否则服务端会拒绝。

          获取方式：
          - Artifact：运行记录底部下载 IPATemplate-unsigned-ipa
          - dist 分支：${RAW_URL}"
          else
            LOG_TAIL="（无 build.log）"
            [ -f build.log ] && LOG_TAIL=$(tail -80 build.log)
            gh issue create --title "❌ 构建失败 · 请查看日志" --body "运行记录：${RUN_URL}

          \`\`\`
          ${LOG_TAIL}
          \`\`\`"
          fi

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build.log
            build/**/*.txt
            build/Logs/**/*.xcresult
          if-no-files-found: ignore
          retention-days: 7
